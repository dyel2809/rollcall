[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# No CBOR metadata suffix: the deployed bytecode is then a pure function of
# source + settings, so BscScan verification reproduces it byte-for-byte
# from deploy/standard-json-input.json alone.
bytecode_hash = "none"
cbor_metadata = false

# Roll Call is a single-contract project with no external dependencies
# beyond forge-std for the test suite.
remappings = ["forge-std/=lib/forge-std/src/"]
